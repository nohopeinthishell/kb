name: Checks

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Должна совпадать с ARG NODE_VERSION в d-client.Dockerfile и d-server.Dockerfile:
          # CI проверяет код на той же мажорной версии, на которой он работает в контейнере.
          node-version: 24
      - name: Install main deps
        run: yarn
      - name: Initialize
        run: yarn lerna bootstrap
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test
