prepare-commit-msg:
  commands:
    task-prefix:
      run: node scripts/prepare-commit-msg.js {1} {2}

pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{ts,tsx}'
      run: yarn eslint {staged_files}
    prettier:
      glob: '*.{ts,tsx,css}'
      run: yarn prettier -w {staged_files}
      stage_fixed: true
